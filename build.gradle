plugins {
  id 'io.github.ben-manes.versions' version '0.61.0'
  id 'scala'
  id 'application'
  id 'org.podval.tools.site-publisher' version '0.2.0'
}

description = 'Financial Calculations'

application.mainClass = 'org.podval.finance.Main'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

scala.scalaVersion = providers.gradleProperty('scalaVersion').get()

// There is no Java in the project :)
project.gradle.startParameter.excludedTaskNames.add('compileJava')

tasks.withType(ScalaCompile).configureEach {
  scalaCompileOptions.with {
    additionalParameters = [
      // Scala 3.9 requires JDK 17+; emit 25 to match the Java toolchain.
      '-release:25',
      '-new-syntax',
      '-feature',
      '-language:strictEquality',
      '-source:future'
    ]
  }
}

site {
  treatErrorsAsWarnings = true
}

// JDK 22+ compatibility flags for the finance `run` task (not site-publisher):
// scala.runtime.LazyVals$ (old lazy-val bytecode on the classpath) uses sun.misc.Unsafe
ext.jdkCompatJvmArgs = [
  '--enable-native-access=ALL-UNNAMED',
  '--sun-misc-unsafe-memory-access=allow',
]

tasks.withType(JavaExec).configureEach {
  jvmArgs jdkCompatJvmArgs
}

def isNonStable = { String version ->
  boolean stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { it -> version.toUpperCase().contains(it) }
  String regex = /^[0-9,.v-]+(-r)?$/
  return !stableKeyword && !(version ==~ regex)
}

// Maven has zio-blocks-schema_3:0.017 (a padded 0.0.17), which both Maven and Gradle
// rank above 0.0.x because the second component is 17.
def hasPaddedNumericComponent = { String version ->
  version.tokenize('.-').any { it.length() > 1 && it ==~ /0\d+/ }
}

tasks.named("dependencyUpdates").configure {
  rejectVersionIf {
    isNonStable(it.candidate.version) || hasPaddedNumericComponent(it.candidate.version)
  }
}
