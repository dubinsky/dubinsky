plugins {
  id 'io.github.ben-manes.versions' version '0.61.0'
  id 'scala'
  id 'application'
}

description = 'Financial Calculations'

application.mainClass = 'org.podval.finance.Main'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

scala.scalaVersion = providers.gradleProperty('scalaVersion').get()

// There is no Java in the project :)
project.gradle.startParameter.excludedTaskNames.add('compileJava')

tasks.withType(ScalaCompile).configureEach {
  scalaCompileOptions.with {
    additionalParameters = [
      // Scala 3.9 requires JDK 17+; emit 25 to match the Java toolchain.
      '-release:25',
      '-new-syntax',
      '-feature',
      '-language:strictEquality',
      '-source:future'
    ]
  }
}

configurations {
  sitePublisher
}

dependencies {
  sitePublisher "org.podval.tools:org.podval.tools.publisher:${providers.gradleProperty('sitePublisherVersion').get()}"
}

// JDK 22+ compatibility flags for transitive / ecosystem native & Unsafe use:
// - AsciidoctorJ → JRuby → jffi calls System.load (restricted native access)
// - scala.runtime.LazyVals$ (old lazy-val bytecode on the classpath) uses sun.misc.Unsafe
ext.jdkCompatJvmArgs = [
  '--enable-native-access=ALL-UNNAMED',
  '--sun-misc-unsafe-memory-access=allow',
]

tasks.withType(JavaExec).configureEach {
  jvmArgs jdkCompatJvmArgs
}

def siteArgs(boolean serve) {
  def args = [
    layout.projectDirectory.asFile.absolutePath,
    '--treat-errors-as-warnings',
  ]
  if (serve) args.add('--serve')
  args
}

def siteSourceTree = fileTree(layout.projectDirectory) {
  exclude '_site'
  exclude '_site/**'
  exclude 'build'
  exclude 'build/**'
  exclude '.gradle'
  exclude '.gradle/**'
  exclude '.git'
  exclude '.git/**'
  exclude '.idea'
  exclude '.idea/**'
  exclude 'out'
  exclude 'out/**'
  exclude '.obsidian'
  exclude '.obsidian/**'
  exclude '.bsp'
  exclude '.bsp/**'
  exclude '.scala-build'
  exclude '.scala-build/**'
  exclude 'src'
  exclude 'src/**'
}

tasks.register('generateSite', JavaExec) {
  group = 'documentation'
  description = 'Generate the static site into _site'
  classpath = configurations.sitePublisher
  mainClass = 'org.podval.tools.publish.site.Site'
  args = siteArgs(false)
  environment 'PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS', '1'
  environment 'PLAYWRIGHT_BROWSERS_PATH', "${gradle.gradleUserHomeDir}/ms-playwright"
  inputs.files(siteSourceTree)
  outputs.dir(layout.projectDirectory.dir('_site'))
}

tasks.register('serveSite', JavaExec) {
  group = 'documentation'
  description = 'Generate the static site and serve it locally'
  classpath = configurations.sitePublisher
  mainClass = 'org.podval.tools.publish.site.Site'
  args = siteArgs(true)
  environment 'PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS', '1'
  environment 'PLAYWRIGHT_BROWSERS_PATH', "${gradle.gradleUserHomeDir}/ms-playwright"
}

def isNonStable = { String version ->
  boolean stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { it -> version.toUpperCase().contains(it) }
  String regex = /^[0-9,.v-]+(-r)?$/
  return !stableKeyword && !(version ==~ regex)
}

// Maven has zio-blocks-schema_3:0.017 (a padded 0.0.17), which both Maven and Gradle
// rank above 0.0.x because the second component is 17.
def hasPaddedNumericComponent = { String version ->
  version.tokenize('.-').any { it.length() > 1 && it ==~ /0\d+/ }
}

tasks.named("dependencyUpdates").configure {
  rejectVersionIf {
    isNonStable(it.candidate.version) || hasPaddedNumericComponent(it.candidate.version)
  }
}
